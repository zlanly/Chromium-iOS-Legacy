name: Build Chromium IPA (legacy iOS 12+, arm64)

# ==========================================================================
#  重要说明（必读）
#  --------------------------------------------------------------------------
#  本工作流设计为在你自己的【自托管 macOS runner】上运行。
#  原因：实测 GitHub 官方托管 macOS runner 为 macOS 26 / Xcode 26 / 3核 / 7GB
#  内存 / 单任务 6 小时上限。磁盘虽已有 ~97GB 空闲（够用），但 M109 这类
#  老 Chromium 在 Xcode 26 下基本编不过，且 3核/7GB 链接阶段极易 OOM、
#  6 小时内冷编完整 Chromium 也跑不完。把你的 Mac 注册为自托管 runner
#  （配同代 Xcode，如 M109 → Xcode 14）即可免费、稳定地跑完，并把产物
#  IPA 自动上传到本次 Actions 的 Artifacts。
#
#  触发方式：在仓库 Actions 页面手动 Run workflow（可填 Chromium 版本 / iOS 最低版本）。
# ==========================================================================

on:
  workflow_dispatch:
    inputs:
      chromium_ref:
        description: "Chromium 版本/提交。默认 M109(109.0.5414.119)，是仍支持 iOS 12 的最新一代附近。"
        required: false
        default: "109.0.5414.119"
      deployment_target:
        description: "iOS 最低部署版本（本方案面向 iOS 12+，填 12.0；M114+ 内核需填 13.0 以上）"
        required: false
        default: "12.0"

jobs:
  build:
    # 自托管 runner 标签；在你的 Mac 上安装 runner 后请保持标签为 self-hosted + macOS
    runs-on: [self-hosted, macOS]
    timeout-minutes: 1440   # 最长 24 小时（自托管 runner 允许更长）

    env:
      CHROMIUM_REF: ${{ github.event.inputs.chromium_ref || '109.0.5414.119' }}
      IOS_DEPLOYMENT_TARGET: ${{ github.event.inputs.deployment_target || '12.0' }}
      DEPOT_TOOLS_UPDATE: 0

    steps:
      - name: Checkout 本仓库（配置 + 脚本）
        uses: actions/checkout@v4
        with:
          path: config-repo

      - name: 安装依赖
        run: |
          brew install ninja gnu-sed python3 || true
          echo "Xcode: $(xcodebuild -version 2>/dev/null | head -1 || echo '未检测到，请安装 Xcode')"

      - name: 克隆 depot_tools
        run: |
          rm -rf "${{ github.workspace }}/depot_tools"
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "${{ github.workspace }}/depot_tools"

      - name: 拉取 Chromium(iOS) 源码
        run: |
          export PATH="${{ github.workspace }}/depot_tools:$PATH"
          mkdir -p "${{ github.workspace }}/chromium"
          cd "${{ github.workspace }}/chromium"
          fetch --no-history ios

      - name: 切换到指定 Chromium 版本
        run: |
          export PATH="${{ github.workspace }}/depot_tools:$PATH"
          cd "${{ github.workspace }}/chromium/src"
          git fetch --tags origin
          git checkout "$CHROMIUM_REF"
          gclient sync -D --with_branch_heads

      - name: 应用 iOS 12 兼容补丁（patches/ 下，缺失则跳过）
        run: |
          export PATH="${{ github.workspace }}/depot_tools:$PATH"
          cd "${{ github.workspace }}/chromium/src"
          bash "${{ github.workspace }}/config-repo/config/apply_patches.sh" "${{ github.workspace }}/config-repo/patches"

      - name: 生成构建配置 (gn)
        run: |
          export PATH="${{ github.workspace }}/depot_tools:$PATH"
          cd "${{ github.workspace }}/chromium/src"
          mkdir -p out/Release-iphoneos
          CONFIG_ARGS="${{ github.workspace }}/config-repo/config/args.gn" \
          IOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
          python3 - <<'PY'
          import os, sys
          t = open(os.environ["CONFIG_ARGS"]).read()
          t = t.replace("__IOS_DEPLOYMENT_TARGET__", os.environ["IOS_DEPLOYMENT_TARGET"])
          with open("out/Release-iphoneos/args.gn", "w") as f:
              f.write(t)
          print("args.gn 已写入，ios_deployment_target =", os.environ["IOS_DEPLOYMENT_TARGET"])
          PY
          gn gen out/Release-iphoneos

      - name: 编译 Chromium (autoninja)
        run: |
          export PATH="${{ github.workspace }}/depot_tools:$PATH"
          cd "${{ github.workspace }}/chromium/src"
          autoninja -C out/Release-iphoneos chrome

      - name: 打包为未签名 IPA（供越狱设备安装）
        run: |
          cd "${{ github.workspace }}/chromium/src/out/Release-iphoneos"
          rm -rf Payload
          mkdir -p Payload
          if [ -d Chromium.app ]; then
            mv Chromium.app Payload/
          else
            echo "未找到 Chromium.app，列出输出目录："
            ls -la
            exit 1
          fi
          IPA="${{ github.workspace }}/Chromium-${CHROMIUM_REF}-ios${IOS_DEPLOYMENT_TARGET}.ipa"
          rm -f "$IPA"
          zip -r -y "$IPA" Payload
          echo "IPA 已生成: $IPA"
          ls -lh "$IPA"

      - name: 上传 IPA 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Chromium-${{ env.CHROMIUM_REF }}-ios${{ env.IOS_DEPLOYMENT_TARGET }}
          path: ${{ github.workspace }}/Chromium-${{ env.CHROMIUM_REF }}-ios${{ env.IOS_DEPLOYMENT_TARGET }}.ipa
          retention-days: 30
