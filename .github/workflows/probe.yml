name: Probe Runner
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: Report environment
        run: |
          echo "== sw_vers =="; sw_vers
          echo "== nproc =="; sysctl -n hw.ncpu
          echo "== mem GB =="; echo $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 ))
          echo "== disk (before cleanup) =="; df -h /
          echo "== xcode =="; xcodebuild -version 2>/dev/null || true
          echo "== /Applications size =="; du -sh /Applications 2>/dev/null || true
